version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # ── Correctness ────────────────────────────────────────────────────────
    - errcheck          # unchecked errors
    - govet             # go vet passes
    - staticcheck       # SA*, S*, ST* checks (supersedes megacheck)
    - unused            # unused code
    - ineffassign       # assignments whose values are never used

    # ── Style / Maintainability ────────────────────────────────────────────
    - gofmt             # formatting
    - goimports         # import ordering
    - revive            # drop-in golint replacement with more rules
    - gocritic          # various micro-optimisations and style checks
    - misspell          # common English misspellings
    - whitespace        # unnecessary blank lines

    # ── Security-oriented ─────────────────────────────────────────────────
    - gosec             # G-series security checks (inline with workflow)
    - bodyclose         # HTTP response body not closed
    - noctx             # HTTP requests without context
    - rowserrcheck      # sql.Rows.Err() not checked
    - sqlclosecheck     # sql.Rows / sql.Stmt not closed
    - exhaustive        # missing switch cases for enums

    # ── Complexity ────────────────────────────────────────────────────────
    - cyclop            # cyclomatic complexity
    - gocognit          # cognitive complexity
    - funlen            # function length

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true

  gosec:
    excludes:
      - G304  # file path from variable (intentional in a scanner tool)
      - G306  # file permissions (intentional)

  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-strings
      - name: indent-error-flow

  cyclop:
    max-complexity: 15

  gocognit:
    min-complexity: 20

  funlen:
    lines: 80
    statements: 50

  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files get looser rules
    - path: "_test\\.go"
      linters:
        - funlen
        - cyclop
        - gocognit
        - gosec
